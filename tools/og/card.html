<!doctype html>
<!-- Source of public/og.png, the link preview image. Render with tools/og/render.sh. -->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/xanh-mono/400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/barlow/400.css" />
    <style>
      :root {
        --enamel: #1c6b5f;
        --enamel-deep: #134b43;
        --on-enamel: #f0f5ee;
        --cap: #f1ead9;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* Small previews (Facebook comments, chat apps) crop the centre 630x630 square, so everything
         sits in that column and is large enough to read at thumbnail size. */
      body {
        background: var(--enamel);
        color: var(--on-enamel);
        font-family: 'Barlow', sans-serif;
        display: grid;
        place-items: center;
      }

      main {
        width: 560px;
        text-align: center;
      }

      .logo {
        display: block;
        width: 196px;
        height: 196px;
        margin: 0 auto;
        border-radius: 40px;
        box-shadow:
          inset 0 0 0 1px rgba(240, 245, 238, 0.12),
          0 26px 50px -20px rgba(8, 30, 26, 0.6);
      }

      h1 {
        margin-top: 34px;
        font-family: 'Xanh Mono', monospace;
        font-weight: 400;
        font-size: 128px;
        line-height: 1;
        letter-spacing: -0.01em;
      }

      .tagline {
        margin-top: 18px;
        font-size: 38px;
        line-height: 1.2;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The two-shoot V from public/favicon.svg, on the deeper enamel. -->
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#134b43" />
        <g transform="translate(16 26) rotate(-111.80)">
          <path
            d="M0 -1.55 C1.81 -2.50 3.62 -2.50 5.65 -2.50 L18.09 -2.60 C20.81 -2.60 22.39 -1.45 22.62 -1.00 C22.39 -0.55 20.81 1.40 18.09 2.10 L5.65 2.50 C3.62 2.50 1.81 2.50 0 1.55 A1.55 1.55 0 0 1 0 -1.55 Z"
            fill="#f1ead9"
          />
        </g>
        <g transform="translate(16 26) rotate(-68.20)">
          <path
            d="M0 -1.55 C1.81 -2.50 3.62 -2.50 5.65 -2.50 L18.09 -2.10 C20.81 -1.40 22.39 0.55 22.62 1.00 C22.39 1.45 20.81 2.60 18.09 2.60 L5.65 2.50 C3.62 2.50 1.81 2.50 0 1.55 A1.55 1.55 0 0 1 0 -1.55 Z"
            fill="#f1ead9"
          />
        </g>
      </svg>
      <h1>Ngó Sen</h1>
      <p class="tagline">Bộ gõ tiếng Việt cho fcitx5 trên Linux.</p>
    </main>
  </body>
</html>
